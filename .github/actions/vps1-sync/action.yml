# Shared by backend.yml (deploy) and infra.yml (sync), research R13:
#   1. join WireGuard with the CI peer config;
#   2. trust only VPS-1's pinned host key (StrictHostKeyChecking=yes) for SSH and rsync;
#   3. rsync infra/ to /srv/madar/infra/ on VPS-1, deleting what master no longer has.
# The calling job runs deploy.sh with the `ssh-command` output, then leaves WireGuard in an
# `if: always()` step.
name: Sync infra to VPS-1
description: Join WireGuard, pin VPS-1's host key, and rsync infra/ to /srv/madar/infra/.

inputs:
  wg-config:
    description: The CI peer's WireGuard client config (secret WG_CI_CONFIG)
    required: true
  ssh-key:
    description: The deploy user's private SSH key (secret DEPLOY_SSH_KEY)
    required: true
  known-hosts:
    description: VPS-1's host key line for 10.8.0.1 (secret DEPLOY_KNOWN_HOSTS)
    required: true

outputs:
  ssh-command:
    description: The ssh command line with the pinned key and host-key options
    value: ${{ steps.ssh.outputs.command }}

runs:
  using: composite
  steps:
    - name: Join WireGuard
      shell: bash
      env:
        WG_CONFIG: ${{ inputs.wg-config }}
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends wireguard-tools
        printf '%s\n' "$WG_CONFIG" | sudo sh -c 'umask 077 && cat > /etc/wireguard/wg0.conf'
        sudo wg-quick up wg0

    - name: Pin the host key
      id: ssh
      shell: bash
      env:
        SSH_KEY: ${{ inputs.ssh-key }}
        KNOWN_HOSTS: ${{ inputs.known-hosts }}
      run: |
        dir="$RUNNER_TEMP/madar-ssh"
        install -d -m 700 "$dir"
        (umask 077 && printf '%s\n' "$SSH_KEY" > "$dir/id" && printf '%s\n' "$KNOWN_HOSTS" > "$dir/known_hosts")
        echo "command=ssh -i $dir/id -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$dir/known_hosts -o ConnectTimeout=20" >> "$GITHUB_OUTPUT"

    - name: rsync infra/ to VPS-1
      shell: bash
      env:
        SSH_COMMAND: ${{ steps.ssh.outputs.command }}
      run: rsync -a --delete -e "$SSH_COMMAND" infra/ deploy@10.8.0.1:/srv/madar/infra/
