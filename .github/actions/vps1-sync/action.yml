# Shared by backend.yml (deploy) and infra.yml (sync), research R13:
#   1. join WireGuard with the CI peer config;
#   2. trust only the pinned host keys (StrictHostKeyChecking=yes) for SSH and rsync;
#   3. rsync infra/ to /srv/madar/infra/ on VPS-1, deleting what master no longer has (skipped
#      with `sync-infra: "false"`).
# Every job that uses it joins the one CI WireGuard peer, so it must be in the `deploy-vps1`
# concurrency group (infra.yml checks this; backend.yml's deploy-vps2 runs after deploy instead).
# The calling job runs deploy.sh with `ssh -F <dir>/config vps1` (or `vps2`), then leaves WireGuard
# in an `if: always()` step. The config file, not command-line options, is what gives the `-J` hop
# the same key and known_hosts (B2-R1-4).
name: Sync infra to VPS-1
description: Join WireGuard, pin VPS-1's host key, and rsync infra/ to /srv/madar/infra/.

inputs:
  wg-config:
    description: The CI peer's WireGuard client config (secret WG_CI_CONFIG)
    required: true
  ssh-key:
    description: The deploy user's private SSH key (secret DEPLOY_SSH_KEY)
    required: true
  known-hosts:
    description: VPS-1's and VPS-2's host key lines (secret DEPLOY_KNOWN_HOSTS)
    required: true
  vps2-host:
    description: VPS-2's VCN IP (variable VPS2_VCN_IP); empty on jobs that only touch VPS-1
    required: false
    default: ""
  sync-infra:
    description: '"false" skips step 3, for jobs that only ship files (admin deploy, PWA release) and must not replace /srv/madar/infra/'
    required: false
    default: "true"

outputs:
  ssh-command:
    description: '`ssh -F <dir>/config`; append `vps1` or `vps2`'
    value: ${{ steps.ssh.outputs.command }}

runs:
  using: composite
  steps:
    - name: Join WireGuard
      shell: bash
      env:
        WG_CONFIG: ${{ inputs.wg-config }}
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends wireguard-tools
        printf '%s\n' "$WG_CONFIG" | sudo sh -c 'umask 077 && cat > /etc/wireguard/wg0.conf'
        sudo wg-quick up wg0

    - name: Pin the host key
      id: ssh
      shell: bash
      env:
        SSH_KEY: ${{ inputs.ssh-key }}
        KNOWN_HOSTS: ${{ inputs.known-hosts }}
        VPS2_HOST: ${{ inputs.vps2-host }}
      run: |
        dir="$RUNNER_TEMP/madar-ssh"
        install -d -m 700 "$dir"
        (umask 077 && printf '%s\n' "$SSH_KEY" > "$dir/id" && printf '%s\n' "$KNOWN_HOSTS" > "$dir/known_hosts")
        "$GITHUB_WORKSPACE/infra/scripts/ssh-config.sh" "$dir" "$VPS2_HOST"
        echo "command=ssh -F $dir/config" >> "$GITHUB_OUTPUT"

    - name: rsync infra/ to VPS-1
      if: inputs.sync-infra != 'false'
      shell: bash
      env:
        SSH_COMMAND: ${{ steps.ssh.outputs.command }}
      run: rsync -a --delete -e "$SSH_COMMAND" infra/ vps1:/srv/madar/infra/
