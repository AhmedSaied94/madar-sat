# The Flutter web PWA: the `master` preview channel, and the public `web-v*` release (FR-025,
# SD §5.2, contracts/web-release.md). Hosting config: infra/firebase/.
#
# A release is a content-addressed folder, `r/<hash>/`: the shell (index.html, sw.js, release.json)
# stays small on Firebase and the app's own files are immutable on the VPS-1 mirror. The live
# channel is only deployed after the mirror serves the new hash, so the shell never points at files
# that are not there yet.
name: pwa

on:
  push:
    branches: [master]
    tags: ["web-v*"]
    paths:
      - "app/**"
      - "infra/firebase/**"
      - ".github/workflows/pwa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pwa-${{ github.ref_type == 'tag' && 'release' || 'preview' }}
  cancel-in-progress: false

jobs:
  flutter-version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: app/.flutter-version
          sparse-checkout-cone-mode: false
      - id: read
        run: |
          version=$(tr -d '[:space:]' < app/.flutter-version)
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error file=app/.flutter-version::expected a version like 3.38.1, got '$version'"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: flutter-version
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    outputs:
      hash: ${{ steps.stage_release.outputs.hash }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ needs.flutter-version.outputs.version }}
          cache: true
      - run: flutter pub get
      # The flavor file is not in the repo: the hosts and Firebase identifiers come from a secret.
      - name: Write env/prod.json from APP_ENV_PROD
        env:
          APP_ENV_JSON: ${{ secrets.APP_ENV_PROD }}
        run: ./tool/write_env.sh env/prod.json
      # The push service worker reads its public Firebase web config from web/firebase-config.js;
      # the committed file is empty so a local `flutter run -d chrome` needs no project (R26).
      - run: ./tool/write_firebase_config.sh env/prod.json
      # --no-web-resources-cdn bundles CanvasKit instead of loading it from www.gstatic.com (FR-042).
      # --pwa-strategy=none keeps Flutter's own service worker out: `web/sw.js` owns the page (R12).
      # The run number is the build number. A tag also names the version; a preview keeps pubspec's.
      - name: Build the web app
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          version=()
          if [[ -n $TAG ]]; then version=("--dart-define=APP_VERSION=${TAG#web-v}"); fi
          flutter build web --release --no-web-resources-cdn --pwa-strategy=none -t lib/main_prod.dart \
            --dart-define-from-file=env/prod.json --dart-define=APP_BUILD_NUMBER="$BUILD_NUMBER" "${version[@]}"
      - name: Validate the release tag
        if: github.ref_type == 'tag'
        run: |
          [[ $GITHUB_REF_NAME =~ ^web-v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::the tag '$GITHUB_REF_NAME' is not web-v<major>.<minor>.<patch>"; exit 1; }
      # The preview channel has no mirror: its release folder is served by Firebase itself, so the
      # shell and the app's files share one origin (contracts/web-release.md).
      - name: Stage the release layout (preview)
        if: github.ref_type == 'branch'
        run: |
          set -euo pipefail
          if [[ ! -x tool/stage_web_release.sh ]]; then
            echo "::warning file=app/tool/stage_web_release.sh::the stage script is not on this commit; the preview deploys build/web"
            exit 0
          fi
          jq '.MIRROR_BASE_URL = ""' env/prod.json > "$RUNNER_TEMP/preview.json"
          ./tool/stage_web_release.sh "$RUNNER_TEMP/preview.json" build/web_release
      # The release needs the real mirror: the shell asks for `r/<hash>/` there first.
      - name: Stage the release layout (release)
        id: stage_release
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          [[ -x tool/stage_web_release.sh ]] \
            || { echo "::error file=app/tool/stage_web_release.sh::the release cannot be staged without this script"; exit 1; }
          mirror=$(jq -r '.MIRROR_BASE_URL // ""' env/prod.json)
          [[ $mirror == https://* ]] \
            || { echo "::error::MIRROR_BASE_URL is '$mirror', not an https URL (contracts/web-release.md)"; exit 1; }
          out=$(./tool/stage_web_release.sh env/prod.json build/web_release)
          hash=$(sed -n 's/^RELEASE_HASH=//p' <<<"$out" | tail -1)
          [[ $hash =~ ^[0-9a-f]{16}$ ]] \
            || { echo "::error::the stage script printed no RELEASE_HASH (got '$out')"; exit 1; }
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          echo "Staged release $hash" >> "$GITHUB_STEP_SUMMARY"
      - name: Choose what to deploy
        id: dist
        run: |
          if [[ -d build/web_release ]]; then
            echo "path=build/web_release" >> "$GITHUB_OUTPUT"
          else
            echo "path=build/web" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pwa-web
          path: app/${{ steps.dist.outputs.path }}
          if-no-files-found: error

  # Deploys from its own job so the Firebase action runs without the Flutter toolchain.
  deploy:
    needs: build
    if: github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: infra/firebase
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pwa-web
          path: infra/firebase/public
      - id: hosting
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          entryPoint: infra/firebase
          channelId: master
          expires: 30d
          firebaseToolsVersion: 15.34.2
          disableComment: true
      - name: Preview channel URL
        env:
          URLS: ${{ steps.hosting.outputs.urls }}
          EXPIRES: ${{ steps.hosting.outputs.expire_time }}
        run: |
          echo "Preview channel: $URLS (expires $EXPIRES)"
          echo "PWA preview: $URLS (expires $EXPIRES)" >> "$GITHUB_STEP_SUMMARY"

  # D4 T045 (contracts/web-release.md): copy the release folder to the VPS-1 mirror, prove it is
  # served with the immutable and CORS headers, and only then move the live channel onto it.
  # It joins the same WireGuard peer as backend.yml's deploy and infra.yml's sync, so it shares
  # their `deploy-vps1` group and never overlaps them (deploy-and-rollback.md). It does not rsync
  # infra/: only master's jobs write /srv/madar/infra/.
  release:
    needs: [build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    concurrency:
      group: deploy-vps1
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # A tag on a commit master never had would ship an app that was never reviewed on master.
      - name: The tag is on master
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master \
            || { echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not an ancestor of origin/master; tag a master commit"; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pwa-web
          path: web_release
      - id: sync
        uses: ./.github/actions/vps1-sync
        with:
          wg-config: ${{ secrets.WG_CI_CONFIG }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          sync-infra: "false"
      - name: Copy the release folder to the mirror
        env:
          SSH_COMMAND: ${{ steps.sync.outputs.ssh-command }}
          HASH: ${{ needs.build.outputs.hash }}
        run: |
          set -euo pipefail
          read -ra ssh <<<"$SSH_COMMAND"
          # Content-addressed, so nothing is ever overwritten and `--delete` stays inside this hash.
          "${ssh[@]}" vps1 "install -d -m 755 /srv/app-mirror/r/$HASH" < /dev/null
          rsync -a --delete -e "$SSH_COMMAND" "web_release/r/$HASH/" "vps1:/srv/app-mirror/r/$HASH/"
          printf '%s\n' "$HASH" | "${ssh[@]}" vps1 'cat > /srv/app-mirror/release-check.txt'
      - name: The mirror serves the release with the right headers
        env:
          HASH: ${{ needs.build.outputs.hash }}
        run: |
          set -euo pipefail
          # The build job's env/prod.json is not in this job; the artifact's release.json carries the
          # mirror the shell was stamped with (app/tool/stage_web_release.sh).
          mirror=$(jq -r '.mirror // ""' web_release/release.json | sed 's:/*$::')
          [[ $mirror == https://* ]] || { echo "::error::web_release/release.json has mirror '$mirror', not an https URL"; exit 1; }
          # The live site's origin, as Caddy's CORS matcher builds it from FIREBASE_PROJECT_ID.
          project=$(jq -r '.projects.default // ""' infra/firebase/.firebaserc)
          [[ $project =~ ^[a-z0-9-]+$ ]] || { echo "::error::infra/firebase/.firebaserc names no default project"; exit 1; }
          origin="https://$project.web.app"
          # `Accept-Encoding: br` proves the precompressed file is served, not re-encoded per request.
          headers=$(curl -sSI -H "Origin: $origin" -H 'Accept-Encoding: br' \
            "$mirror/r/$HASH/main.dart.js")
          for expected in \
            'HTTP/2 200' \
            'cache-control: public, max-age=31536000, immutable' \
            "access-control-allow-origin: $origin" \
            'content-encoding: br' \
            'x-content-type-options: nosniff'; do
            grep -qi "$expected" <<<"$headers" \
              || { echo "::error::the mirror for $HASH is missing '$expected'"; echo "$headers"; exit 1; }
          done
          # `release-check.txt` is what Kuma watching the mirror polls.
          served=$(curl -sS "$mirror/release-check.txt")
          [[ $served == "$HASH" ]] \
            || { echo "::error::release-check.txt says '$served', not $HASH"; exit 1; }
          echo "Mirror verified for $HASH" >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare the hosting directory
        run: |
          set -euo pipefail
          # firebase.json's `public` is this folder, relative to `infra/firebase`.
          rm -rf infra/firebase/public
          cp -a web_release infra/firebase/public
      - name: Deploy the live channel
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          entryPoint: infra/firebase
          channelId: live
          firebaseToolsVersion: 15.34.2
          disableComment: true
      - name: Prune old mirror releases
        env:
          SSH_COMMAND: ${{ steps.sync.outputs.ssh-command }}
        run: |
          set -euo pipefail
          read -ra ssh <<<"$SSH_COMMAND"
          # Older than 30 days, always keeping the newest 3 (data-model.md).
          # shellcheck disable=SC2016 # the remote shell expands these, not this one
          "${ssh[@]}" vps1 'cd /srv/app-mirror/r && cutoff=$(($(date +%s) - 2592000)) && ls -1dt */ | tail -n +4 | while IFS= read -r old; do [ "$(stat -c %Y "$old")" -lt "$cutoff" ] && rm -rf -- "$old"; done; true' < /dev/null
          echo "Pruned mirror releases older than 30 days, keeping the newest 3" >> "$GITHUB_STEP_SUMMARY"
      - name: Leave WireGuard
        if: always()
        run: |
          sudo wg-quick down wg0 || true
          rm -rf "$RUNNER_TEMP/madar-ssh"
