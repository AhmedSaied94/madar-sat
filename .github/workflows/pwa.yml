# The Flutter web PWA → Firebase Hosting preview channel `master`, kept for 30 days (FR-025,
# SD §5.2, research R14). Hosting config: infra/firebase/. The public release (web-v* tags and the
# VPS-1 mirror) arrives on D4.
name: pwa

on:
  push:
    branches: [master]
    paths:
      - "app/**"
      - "infra/firebase/**"
      - ".github/workflows/pwa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pwa-preview
  cancel-in-progress: false

jobs:
  flutter-version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: app/.flutter-version
          sparse-checkout-cone-mode: false
      - id: read
        run: |
          version=$(tr -d '[:space:]' < app/.flutter-version)
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error file=app/.flutter-version::expected a version like 3.38.1, got '$version'"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: flutter-version
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ needs.flutter-version.outputs.version }}
          cache: true
      - run: flutter pub get
      - run: flutter build web --release -t lib/main_prod.dart --dart-define-from-file=env/prod.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pwa-web
          path: app/build/web
          if-no-files-found: error

  # Deploys from its own job so the Firebase action runs without the Flutter toolchain.
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: infra/firebase
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pwa-web
          path: app/build/web
      - id: hosting
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          entryPoint: infra/firebase
          channelId: master
          expires: 30d
          firebaseToolsVersion: 15.34.2
          disableComment: true
      - name: Preview channel URL
        env:
          URLS: ${{ steps.hosting.outputs.urls }}
          EXPIRES: ${{ steps.hosting.outputs.expire_time }}
        run: |
          echo "Preview channel: $URLS (expires $EXPIRES)"
          echo "PWA preview: $URLS (expires $EXPIRES)" >> "$GITHUB_STEP_SUMMARY"
