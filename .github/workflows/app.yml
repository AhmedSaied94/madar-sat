# app/ checks and the prod-flavor debug APK (FR-025, research R14). Everything runs with the
# Flutter version pinned in app/.flutter-version on a pinned OS (ubuntu-24.04); that pin plus
# the bundled fonts is what renders the goldens (R18).
name: app

on:
  push:
    branches: [master]
    paths:
      - "app/**"
      - "backend/openapi/public.json"
      - "madar-design/**"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "app/**"
      - "backend/openapi/public.json"
      - "madar-design/**"
      - ".github/workflows/app.yml"

permissions:
  contents: read

concurrency:
  group: app-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  flutter-version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: app/.flutter-version
          sparse-checkout-cone-mode: false
      - id: read
        run: |
          version=$(tr -d '[:space:]' < app/.flutter-version)
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error file=app/.flutter-version::expected a version like 3.38.1, got '$version'"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  check:
    needs: flutter-version
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ needs.flutter-version.outputs.version }}
          cache: true
      - name: Install ripgrep (the literal and token checks use rg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ripgrep
      - run: flutter pub get
      # M-R3-2: backend.yml's `clients` job only compares the network client, so a provider
      # *.g.dart left stale (or never committed) by a source change would pass. Fail on any diff.
      - name: Check no generated *.g.dart is stale
        run: |
          dart run build_runner build -d
          if [[ -n $(git status --porcelain -- lib) ]]; then
            git status --short -- lib
            git diff -- lib
            echo "::error::build_runner changed app/lib; run it and commit the output"
            exit 1
          fi
      - run: flutter analyze
      - run: ./tool/check_token_copy.sh
      - run: ./tool/check_literals.sh
      - name: flutter test (goldens included)
        run: flutter test
      # M-R1-2 / B2-R2-13: the PWA opens drift on the web, so the build must ship sqlite3.wasm and
      # drift_worker.js. The same flags as pwa.yml, on every PR that touches app/.
      - name: Build the web app and check its drift assets
        run: |
          flutter build web --release --no-web-resources-cdn -t lib/main_prod.dart --dart-define-from-file=env/prod.json
          ./tool/check_web_assets.sh build/web
      # `tool/check_providers.sh` stays out of CI on purpose: Lane M is moving that check into
      # `flutter test` (`m-round-2.md` M-R2-7), which this job already runs.
      - name: Build the prod-flavor debug APK (it calls VPS-1)
        run: flutter build apk --debug --flavor prod -t lib/main_prod.dart --dart-define-from-file=env/prod.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-prod-debug.apk
          path: app/build/app/outputs/flutter-apk/app-prod-debug.apk
          if-no-files-found: error
