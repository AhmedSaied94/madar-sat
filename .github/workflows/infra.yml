# infra/ checks on every PR and push that touches infra/ or CI (research R14), and on master
# the sync job that applies infra/ to VPS-1 without a backend change (R13).
name: infra

on:
  push:
    branches: [master]
    paths:
      - "infra/**"
      - ".github/workflows/**"
      - ".github/actions/**"
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/**"
      - ".github/actions/**"
      # The runbooks carry the exact commands the scripts run; check-doc-commands.sh compares them.
      - "docs/runbooks/**"

permissions:
  contents: read

concurrency:
  group: infra-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the Compose files
        run: |
          for f in vps1 vps2 dev home-box; do
            echo "::group::infra/compose/$f.yml"
            docker compose -f "infra/compose/$f.yml" --env-file infra/compose/example.env config -q
            echo "::endgroup::"
          done

      # D4 T032/T034 (research R1, R3): the public app must see the real client IP. Caddy runs on
      # the host and reaches `api-public` over the bridge, so that gateway is fixed and trusted, and
      # uvicorn is told the same list. The allowlist for the load-test window is empty by default.
      - name: the public API trusts only the fixed bridge gateway
        run: |
          set -euo pipefail
          rendered=$(docker compose -f infra/compose/vps1.yml --env-file infra/compose/example.env \
            --profile tools config --format json)
          subnet=$(jq -r '.networks.default.ipam.config[0].subnet' <<<"$rendered")
          [[ $subnet == 172.30.0.0/24 ]] \
            || { echo "::error::VPS-1's default network is '$subnet', not 172.30.0.0/24 (R1)"; exit 1; }
          gateway=$(jq -r '.networks.default.ipam.config[0].gateway' <<<"$rendered")
          [[ $gateway == 172.30.0.1 ]] \
            || { echo "::error::VPS-1's default gateway is '$gateway', not 172.30.0.1 (R1)"; exit 1; }
          trusted=$(jq -r '.services["api-public"].environment.TRUSTED_PROXIES' <<<"$rendered")
          [[ $trusted == "127.0.0.1,172.30.0.1" ]] \
            || { echo "::error::api-public trusts '$trusted'"; exit 1; }
          command=$(jq -r '.services["api-public"].command | join(" ")' <<<"$rendered")
          [[ $command == *"--forwarded-allow-ips=$trusted"* ]] \
            || { echo "::error::api-public's uvicorn does not trust the same list as settings ($command)"; exit 1; }
          [[ $command == *"-w 2"* ]] || { echo "::error::api-public lost its two workers"; exit 1; }
          exempt=$(jq -r '.services["api-public"].environment.RATE_LIMIT_EXEMPT_IPS' <<<"$rendered")
          [[ -z $exempt ]] || { echo "::error::RATE_LIMIT_EXEMPT_IPS is not empty by default ('$exempt')"; exit 1; }
          # The admin app must never inherit the public trust list from the shared .env.
          admin=$(jq -r '.services["api-admin"].environment.TRUSTED_PROXIES // ""' <<<"$rendered")
          [[ -z $admin ]] \
            || { echo "::error::api-admin sets TRUSTED_PROXIES ('$admin'); it keeps the 10.8.0.1 default"; exit 1; }

      # D4 T032/T041/T043 (research R8, R10, contracts/web-release.md): the release folder is
      # immutable and precompressed, `release-check.txt` revalidates, and the admin site serves the
      # symlink the deploy swaps.
      - name: The mirror and the admin site follow the release contract
        run: |
          set -euo pipefail
          app=$(awk '/^app\./,/^}/' infra/Caddyfile)
          grep -q '@release path /r/\*' <<<"$app" \
            || { echo "::error::the app. site has no /r/* release matcher"; exit 1; }
          grep -q 'header @release Cache-Control "public, max-age=31536000, immutable"' <<<"$app" \
            || { echo "::error::/r/* is not immutable"; exit 1; }
          grep -q 'precompressed br gzip' <<<"$app" \
            || { echo "::error::the app. site serves compressed on the fly instead of precompressed files"; exit 1; }
          if grep -qE '^[[:space:]]*encode ' <<<"$app"; then
            echo "::error::the app. site still encodes; the release job ships .br and .gz"
            exit 1
          fi
          grep -q '@release_check path /release-check.txt' <<<"$app" \
            || { echo "::error::the app. site does not revalidate /release-check.txt"; exit 1; }
          awk '/@release_check/,/}/' <<<"$app" | grep -q 'Cache-Control "no-cache"' \
            || { echo "::error::release-check.txt is cached"; exit 1; }
          admin=$(awk '/^https:\/\/10\.8\.0\.1 \{/,/^}/' infra/Caddyfile)
          grep -q 'root \* /srv/admin/current' <<<"$admin" \
            || { echo "::error::the admin site does not serve the current release symlink"; exit 1; }
          grep -q 'handle /admin/api/\*' <<<"$admin" \
            || { echo "::error::the admin site lost its /admin/api handler"; exit 1; }
          # A-R1-8: the admin shows media-host images and audio; only that host is allowed besides 'self'.
          csp=$(grep -o 'Content-Security-Policy "[^"]*"' <<<"$admin")
          for directive in "default-src 'self'" \
            "img-src 'self' https://media.{\$VPS1_IP}.sslip.io;" \
            "media-src 'self' https://media.{\$VPS1_IP}.sslip.io;"; do
            grep -qF "$directive" <<<"$csp" \
              || { echo "::error::the admin CSP lacks: $directive"; exit 1; }
          done

          jq -e '.hosting.headers[]
            | select(.regex == "^/r/[0-9a-f]{16}/.*$")
            | .headers[]
            | select(.value == "public, max-age=31536000, immutable")' infra/firebase/firebase.json >/dev/null \
            || { echo "::error::firebase.json has no immutable rule for /r/<hash>/"; exit 1; }
          for name in release.json drift_worker.js; do
            grep -q "$name" <<<"$(jq -r '.hosting.headers[].source // ""' infra/firebase/firebase.json)" \
              || { echo "::error::firebase.json does not revalidate $name"; exit 1; }
          done

      # The backup profile is a one-shot: `config` must see it, and the media units call it by name.
      # Rendered as JSON: Compose prints volumes in long form, so a short-syntax grep never matches.
      - name: The backup services are defined behind their profile
        run: |
          set -euo pipefail
          for host in vps1 vps2; do
            services=$(docker compose -f "infra/compose/$host.yml" --env-file infra/compose/example.env \
              --profile backup config --services)
            expected=$([[ $host == vps1 ]] && echo backup-media || echo backup-db)
            grep -qx "$expected" <<<"$services" \
              || { echo "::error::$host.yml has no $expected service"; exit 1; }
          done

          v1=$(docker compose -f infra/compose/vps1.yml --env-file infra/compose/example.env --profile backup config)
          grep -q 'backup-media.sh' <<<"$v1" || { echo "::error::backup-media runs no script"; exit 1; }
          grep -q -- '--weekly' <<<"$v1" || { echo "::error::backup-media-weekly lost its flag"; exit 1; }

          # Both profiles, so the one-shot backup service is in the same render as the workers.
          v2=$(docker compose -f infra/compose/vps2.yml --env-file infra/compose/example.env \
            --profile workers --profile backup config --format json)
          # The FCM key is mounted read-only into worker-notify and into nothing else (R9).
          jq -e '.services["worker-notify"].volumes | any(.source == "/srv/secrets" and .read_only == true)' \
            <<<"$v2" >/dev/null \
            || { echo "::error::worker-notify no longer mounts the FCM secret read-only"; exit 1; }
          users=$(jq -r '.services | to_entries[]
            | select([.value.volumes // [] | .[] | .source?] | index("/srv/secrets"))
            | .key' <<<"$v2")
          [[ $users == worker-notify ]] \
            || { echo "::error::/srv/secrets is mounted by: ${users//$'\n'/, }"; exit 1; }
          jq -e '.services["uptime-kuma"].image | startswith("louislam/uptime-kuma")' <<<"$v2" >/dev/null \
            || { echo "::error::Kuma is gone from vps2.yml"; exit 1; }
          jq -e '.services["backup-db"].profiles == ["backup"]' <<<"$v2" >/dev/null \
            || { echo "::error::backup-db is not behind the backup profile"; exit 1; }
          # The live poller saves raw pages, and the deploy must start it (D5 T043).
          jq -e '.services["worker-live"] | (.volumes | any(.source == "/srv/raw")) and .environment.RAW_ROOT != null' \
            <<<"$v2" >/dev/null \
            || { echo "::error::worker-live lost RAW_ROOT or the /srv/raw mount"; exit 1; }
          grep -Eq '^vps2_services=\(.*\bworker-live\b' infra/scripts/deploy.sh \
            || { echo "::error::deploy.sh no longer starts worker-live"; exit 1; }

      # B2-R1-1: the backup services carry their own tag. The timer's shell has no IMAGE_TAG (it is
      # set by deploy.sh), and `madar-backup` is tagged by this workflow (the run SHA and the moving
      # `stable`), never by the backend's deploy SHA. Compose interpolates the whole file for every
      # command, so this renders both files with an env file that has no IMAGE_TAG at all: the
      # backup services must still resolve, and so must the backend's (`:none`, unpullable).
      #
      # The profiles have to include the backend service's: `config` filters the model to the
      # profiles it is given, so `--profile backup` alone renders `worker-imports` as null.
      - name: The backup services start without IMAGE_TAG
        run: |
          set -euo pipefail
          grep -v '^IMAGE_TAG=' infra/compose/example.env > "$RUNNER_TEMP/no-tag.env"
          for host in vps1 vps2; do
            if [[ $host == vps1 ]]; then
              service=backup-media
              backend_service=api-public
              profiles=(--profile backup)
            else
              service=backup-db
              backend_service=worker-imports
              profiles=(--profile backup --profile workers)
            fi
            rendered=$(docker compose -f "infra/compose/$host.yml" --env-file "$RUNNER_TEMP/no-tag.env" \
              "${profiles[@]}" config --format json)
            image=$(jq -r --arg s "$service" '.services[$s].image' <<<"$rendered")
            [[ $image == ghcr.io/example-owner/madar-backup:stable ]] \
              || { echo "::error::$host.yml: $service resolves to '$image', not madar-backup:stable"; exit 1; }
            backend=$(jq -r --arg s "$backend_service" '.services[$s].image' <<<"$rendered")
            [[ $backend == ghcr.io/example-owner/madar-backend:none ]] \
              || { echo "::error::$host.yml: the backend image still requires IMAGE_TAG ($backend)"; exit 1; }
            tagged=$(BACKUP_IMAGE_TAG=2026-01-01 docker compose -f "infra/compose/$host.yml" \
              --env-file "$RUNNER_TEMP/no-tag.env" "${profiles[@]}" config --format json \
              | jq -r --arg s "$service" '.services[$s].image')
            [[ $tagged == ghcr.io/example-owner/madar-backup:2026-01-01 ]] \
              || { echo "::error::$host.yml: BACKUP_IMAGE_TAG does not reach $service"; exit 1; }
          done

      # B2-R1-2: the backup containers run as the uid that owns their paths, with every capability
      # dropped. The script reads the rendered Compose files, the bootstrap and the deploy, then
      # proves the permissions with a container on a host-shaped tree.
      - name: The backup containers can write the staging directory and read the media
        run: infra/scripts/check-backup-permissions.sh

      # B2-R1-3 / B2-R1-5: the real scripts, against local restic repositories: an empty repository
      # is created, and 7/4 retention prunes because the host and the dump path are pinned.
      - name: The backups initialise their repository and prune
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq restic
          infra/scripts/check-backup-retention.sh

      # B2-R2-1: Kuma shows a push URL as `…/api/push/<token>?status=up&msg=OK&ping=`, and the scripts
      # appended `?status=down` after it, so Kuma recorded `up` for a backup that failed. The real
      # scripts run against a local HTTP stub, with that URL and with the bare one the runbook gives,
      # and the stub must have seen `status=down`.
      - name: A failed backup pushes status=down to Kuma
        run: infra/scripts/check-backup-heartbeat.sh

      # B2-R2-2: the runbook's morning check and both media restores, run in the real backup image
      # (restic 0.14, uid 10001, no capabilities) over a local repository: `snapshots --last 3` listed
      # nothing, the read-only mount refused the restore, and a root restore left unreadable files.
      - name: The backups runbook's snapshot list and media restores work
        run: infra/scripts/check-backup-restore-commands.sh

      # B2-R1-7 / B2-R2-1 / B2-R2-2: the FCM key install, the `--latest 3` morning check, the media
      # restore wrappers and the per-host Kuma push URL, as literals in the documents that carry them.
      - name: The runbook commands are the ones that work
        run: infra/scripts/check-doc-commands.sh

      # The D3 timers must exist, name a real service, and use the Cairo calendar (R19).
      - name: Verify the backup systemd units
        run: |
          set -euo pipefail
          systemd-analyze verify infra/systemd/backup-db.service infra/systemd/backup-db.timer \
            infra/systemd/backup-media.service infra/systemd/backup-media.timer \
            infra/systemd/backup-media-weekly.service infra/systemd/backup-media-weekly.timer \
            || { echo "::error::the backup units don't verify"; exit 1; }
          grep -q 'Africa/Cairo' infra/systemd/backup-db.timer
          grep -q 'Africa/Cairo' infra/systemd/backup-media.timer
          grep -q 'OnCalendar=Sun' infra/systemd/backup-media-weekly.timer
          for unit in infra/systemd/*.service; do
            grep -q 'compose/vps[12].yml run --rm -T' "$unit" \
              || { echo "::error::$unit does not run a backup container"; exit 1; }
          done
          # D4 T030: the heartbeat arrives only if the timer exists. The bootstrap is what installs
          # and enables it (a deploy may not), so both roles' timers must stay in its list.
          for timer in backup-db.timer backup-media.timer backup-media-weekly.timer; do
            grep -q "\b$timer\b" infra/scripts/bootstrap-vps.sh \
              || { echo "::error::bootstrap-vps.sh no longer installs $timer"; exit 1; }
          done

      # The backup scripts never echo a secret and never run without their key variables.
      - name: The backup scripts fail fast on missing settings
        run: |
          set -euo pipefail
          grep -q 'set -Eeuo pipefail' infra/backup/backup-db.sh
          grep -q 'set -Eeuo pipefail' infra/backup/backup-media.sh
          # Comments are allowed to name a variable; a command that would print one is not.
          if grep -vE '^[[:space:]]*#' infra/backup/*.sh \
            | grep -nE '^[[:space:]]*set -x|(echo|printf)[^#]*\$\{?(RESTIC_PASSWORD|B2_ACCOUNT_KEY|B2_ACCOUNT_ID|POSTGRES_PASSWORD|RCLONE_CONFIG_OCI_SECRET_ACCESS_KEY|TELEGRAM_BOT_TOKEN)'; then
            echo "::error::a backup script would print a secret"
            exit 1
          fi
          # With no environment, both exit non-zero before touching a host.
          if env -i PATH="$PATH" infra/backup/backup-db.sh; then
            echo "::error::backup-db.sh ran without its settings"
            exit 1
          fi
          if env -i PATH="$PATH" infra/backup/backup-media.sh; then
            echo "::error::backup-media.sh ran without its settings"
            exit 1
          fi

      # The home box's units run the update script; `verify` catches a typo or a bad directive.
      - name: Verify the home-box systemd units
        run: |
          systemd-analyze verify infra/scripts/home-box-update.service infra/scripts/home-box-update.timer \
            || { echo "::error::the home-box units don't verify"; exit 1; }

      # The ACL file is rendered at deploy time (deploy.sh). Every password argument (`>...`) on
      # every `user` line must be one of the two placeholders, wherever it sits on the line: a
      # regex anchored at the end of the line missed `user default on >literal ~* &* +@all`
      # (B2-R1-17). The two bad fixtures below must be rejected, or this step can't fail.
      - name: The Redis ACL template holds placeholders only
        run: |
          # The two placeholders, built without a single-quoted `${...}`, which shellcheck flags as
          # SC2016 (the same reason deploy.sh's envsubst line carries a directive).
          default_token=">\${REDIS_PASSWORD}"
          homebox_token=">\${REDIS_HOMEBOX_PASSWORD}"
          check_template() {
            local file=$1 token
            while IFS= read -r token; do
              case $token in
                "$default_token" | "$homebox_token") ;;
                *)
                  echo "::error::$file has a literal password ($token); use a \${...} placeholder"
                  return 1
                  ;;
              esac
            done < <(grep -E '^[[:space:]]*user[[:space:]]' "$file" | grep -oE '>[^[:space:]]+')
          }
          check_template infra/redis/users.acl.tmpl
          grep -qF "user homebox on $homebox_token" infra/redis/users.acl.tmpl \
            || { echo "::error::the template lost the homebox user"; exit 1; }

          bad=$(mktemp -d)
          printf '%s\n' 'user default on >hunter2 ~* &* +@all' > "$bad/mid-line.acl"
          printf '%s\n' "user homebox on $homebox_token >literal-password ~* &* +@all" > "$bad/second.acl"
          for fixture in "$bad"/*.acl; do
            if check_template "$fixture"; then
              echo "::error::the placeholder check accepted $fixture"
              exit 1
            fi
          done

      # B2-R1-1 / B2-R2-1: mode 600 owned by deploy made redis:7.4.12 abort with "Permission
      # denied", and so did a 640 file in a 700 directory. The check renders through the deploy's own
      # script, refuses a 700 directory, and rotates the password once (B2-R2-11).
      - name: redis reads the rendered ACL as uid 999
        run: infra/scripts/check-redis-acl.sh

      # B2-R2-10: `getent` exits 2 for a gid that has no group, and under `pipefail` that killed the
      # bootstrap before its `groupadd` branch. The lookup must tolerate a missing gid.
      - name: the bootstrap's gid lookup survives a gid with no group
        run: |
          set -euo pipefail
          awk '/^group_for_gid\(\)/,/^}/' infra/scripts/bootstrap-vps.sh > "$RUNNER_TEMP/gid.sh"
          source "$RUNNER_TEMP/gid.sh"
          unused=54321
          getent group "$unused" >/dev/null && { echo "::error::gid $unused is taken on the runner"; exit 1; }
          found=$(group_for_gid "$unused")
          [[ -z $found ]] || { echo "::error::a gid with no group answered '$found'"; exit 1; }
          [[ "$(group_for_gid 0)" == root ]] || { echo "::error::the lookup lost an existing gid"; exit 1; }

      # B2-R1-6: the check must tell the two hosts apart: VPS-2 has no Redis rule to satisfy.
      - name: the firewall check knows both roles
        run: |
          set -euo pipefail
          # Built by hand: a single-quoted `${...}` list trips SC2016, and envsubst needs the names
          # literally (the same reason deploy.sh's render line carries the directive).
          names="\${VCN_IP} \${PEER_VCN_IP} \${HOME_BOX_WG_IP}"
          render() {
            VCN_IP=10.0.0.2 PEER_VCN_IP=10.0.0.1 HOME_BOX_WG_IP=192.0.2.10 \
              envsubst "$names" < "infra/firewall/$1.rules" > "$2"
          }
          render vps1 "$RUNNER_TEMP/vps1.rules"
          render vps2 "$RUNNER_TEMP/vps2.rules"
          infra/scripts/check-firewall.sh --role vps1 --expectations "$RUNNER_TEMP/vps1.rules"
          infra/scripts/check-firewall.sh --role vps2 --expectations "$RUNNER_TEMP/vps2.rules"
          # A VPS-1 set without the home-box Redis rule must fail.
          if infra/scripts/check-firewall.sh --role vps1 --expectations "$RUNNER_TEMP/vps2.rules"; then
            echo "::error::the check accepted a VPS-1 ruleset without the home-box Redis rule"
            exit 1
          fi

      # B2-R1-5: Docker would create a missing bind source as root:root, and the uid-10001 workers
      # could not write a raw page. The bootstrap must create it for them.
      - name: the bootstrap creates /srv/raw on VPS-2
        run: |
          awk '/^ensure_dirs\(\)/,/^}/' infra/scripts/bootstrap-vps.sh > "$RUNNER_TEMP/ensure_dirs.sh"
          grep -q 'role == vps2' "$RUNNER_TEMP/ensure_dirs.sh"
          awk '/role == vps2/,/^  fi/' "$RUNNER_TEMP/ensure_dirs.sh" | grep -q '/srv/raw'

      # B2-R1-4 / B2-R2-7: `ssh -i key -J deploy@10.8.0.1` gives the jump host none of those options.
      # The config file must give both hops the key, BatchMode and the pinned known_hosts, and VPS-2's
      # key must be listed under the address ssh connects to (its VCN IP, not an alias).
      - name: the ssh config gives the jump host the same key
        run: |
          set -euo pipefail
          dir=$(mktemp -d); chmod 700 "$dir"
          (umask 077 && printf 'not-a-real-key\n' > "$dir/id"
            printf '10.8.0.1 ssh-ed25519 AAAA\n10.0.0.5 ssh-ed25519 BBBB\n' > "$dir/known_hosts")
          infra/scripts/ssh-config.sh "$dir" 10.0.0.5
          out=$(ssh -G -F "$dir/config" vps2)
          grep -qx 'user deploy' <<<"$out"
          grep -qx 'proxyjump vps1' <<<"$out"
          grep -qx 'hostname 10.0.0.5' <<<"$out"
          grep -qx "identityfile $dir/id" <<<"$out"
          grep -qx 'identitiesonly yes' <<<"$out"
          grep -qx 'stricthostkeychecking true' <<<"$out"
          grep -qx "userknownhostsfile $dir/known_hosts" <<<"$out"
          grep -q '^10.0.0.5 ' "$dir/known_hosts"  # the key ssh will look up for vps2
          grep -qx "identityfile $dir/id" <<<"$(ssh -G -F "$dir/config" vps1)"

      - name: Validate the Caddyfile
        run: |
          docker run --rm --env-file infra/compose/example.env \
            -v "$PWD/infra:/etc/madar/infra:ro" \
            caddy:2.11.7 caddy validate --config /etc/madar/infra/Caddyfile --adapter caddyfile
          # B2-R1-6: constitution V allows public CORS only to the PWA's origins, so no site may
          # answer a wildcard, and the media site must echo the Origin (preview channels included)
          # for GET/HEAD with Vary: Origin.
          if grep -qE 'Access-Control-Allow-Origin "\*"' infra/Caddyfile; then
            echo "::error::a site answers Access-Control-Allow-Origin '*' (constitution V)"
            exit 1
          fi
          media=$(awk '/^media\./,/^}/' infra/Caddyfile)
          grep -q 'header Vary Origin' <<<"$media" \
            || { echo "::error::the media site does not send Vary: Origin"; exit 1; }
          grep -q 'method GET HEAD' <<<"$media" \
            || { echo "::error::the media site's CORS matcher is not limited to GET and HEAD"; exit 1; }
          grep -q 'header @pwa_origin Access-Control-Allow-Origin' <<<"$media" \
            || { echo "::error::the media site no longer echoes the PWA origin"; exit 1; }
          # shellcheck disable=SC2016 # the literal matcher, with Caddy's placeholder
          grep -qF 'header_regexp Origin ^https://{$FIREBASE_PROJECT_ID}(--[a-z0-9-]+)?' <<<"$media" \
            || { echo "::error::the media site's CORS matcher does not allow a preview channel"; exit 1; }

      # B2-R2-2: the action called `$GITHUB_ACTION_PATH/../../infra/scripts/ssh-config.sh`, which
      # resolves to .github/infra/... and exits 127, so deploy, deploy-vps2 and sync all failed.
      - name: the deploy action calls ssh-config.sh where it lives
        run: |
          set -euo pipefail
          action=.github/actions/vps1-sync/action.yml
          call=$(grep -oE "[$](GITHUB_WORKSPACE|GITHUB_ACTION_PATH)[^\"]*ssh-config[.]sh" "$action" | head -1)
          [[ -n $call ]] || { echo "::error::$action calls no resolved ssh-config.sh path"; exit 1; }
          resolved=${call//\$GITHUB_WORKSPACE/$PWD}
          resolved=${resolved//\$GITHUB_ACTION_PATH/$PWD/.github/actions/vps1-sync}
          [[ -f $resolved ]] || { echo "::error::the action calls $call, which resolves to $resolved"; exit 1; }
          [[ -x $resolved ]] || { echo "::error::$resolved is not executable"; exit 1; }
          # Run the resolved path the way the action does, so a broken script fails here too.
          dir=$(mktemp -d); chmod 700 "$dir"
          (umask 077 && printf 'not-a-real-key\n' > "$dir/id" && printf 'ssh-ed25519 AAAA\n' > "$dir/known_hosts")
          "$resolved" "$dir" "" >/dev/null
          grep -qx 'Host vps1' "$dir/config"

      # B2-R2-12: VPS-2's `up -d` ran under `set -e`, so a failed start exited without rolling back.
      # The function is extracted and driven with stubs: a failing `up -d` must reach the restore.
      - name: a failed VPS-2 start rolls back
        run: |
          set -euo pipefail
          awk '/^deploy_vps2\(\)/,/^}/' infra/scripts/deploy.sh > "$RUNNER_TEMP/deploy_vps2.sh"
          source "$RUNNER_TEMP/deploy_vps2.sh"
          state_dir=$RUNNER_TEMP/state
          install -d "$state_dir"
          # shellcheck disable=SC2034 # GHCR_TOKEN, workers_timeout and vps2_compose are read by the
          # extracted deploy_vps2.
          GHCR_TOKEN=ci-token
          # shellcheck disable=SC2034 # read by the extracted deploy_vps2
          workers_timeout=1
          log() { printf '[deploy] %s\n' "$*"; }
          die() { printf '[deploy] error: %s\n' "$*" >&2; exit 1; }
          env_get() { printf 'ci-owner\n'; }
          running_tag() { printf 'previous-tag\n'; }
          healthy_services() { return 1; }
          docker() { return 0; }
          # D3: deploy_vps2 only verifies the folders and timers bootstrap created (B2-R1-4). That
          # check is read-only, covered by its own step, and not what this drill is about; a stub
          # here can no longer hide root-only work, because deploy.sh has none (the step below).
          require_host_setup() { :; }
          # `$1` is the compose verb; failing `up` is what the guards are about. (A `case` on `$*`
          # with a leading space never matches, which silently tested the healthy path.)
          compose_stub() {
            [[ ${1:-} == up ]] && return 1
            return 0
          }
          # shellcheck disable=SC2034 # read by the extracted deploy_vps2
          vps2_compose=(compose_stub)
          out=$RUNNER_TEMP/vps2-deploy.log
          set +e
          # `set -e` inside the subshell: it is exactly what a deploy runs under, and a conditional
          # call would disable errexit and hide the bug this step exists to catch.
          ( set -e; deploy_vps2 new-tag ) > "$out" 2>&1
          status=$?
          set -e
          cat "$out"
          [[ $status -ne 0 ]] || { echo "::error::the failed deploy exited 0"; exit 1; }
          grep -q 'restoring previous-tag' "$out" \
            || { echo "::error::a failed up -d exited before the rollback (B2-R2-12)"; exit 1; }
          grep -q 'rolled back to previous-tag' "$out" \
            || { echo "::error::the rollback never reported its result"; exit 1; }

      # B2-R3-2: a failed `up -d --wait` recreates Redis on a refused ACL *before* the reload runs.
      # `apply_stateful_infra` must put the previous file back and retry, or Redis stays down.
      - name: a refused ACL during the infra up restores the previous one
        run: |
          set -euo pipefail
          awk '/^apply_stateful_infra\(\)/,/^}/' infra/scripts/deploy.sh > "$RUNNER_TEMP/apply_infra.sh"
          awk '/^restore_previous_acl\(\)/,/^}/' infra/scripts/deploy.sh > "$RUNNER_TEMP/restore_acl.sh"
          source "$RUNNER_TEMP/restore_acl.sh"
          source "$RUNNER_TEMP/apply_infra.sh"
          # The subnet guard has its own step ("the deploy stops before a subnet change …").
          check_network() { :; }
          state_dir=$RUNNER_TEMP/state
          acl_dir=$state_dir/redis
          acl_target=$acl_dir/users.acl
          acl_previous=$acl_dir/users.acl.prev
          # shellcheck disable=SC2034 # all three are read by the extracted functions
          acl_gid=$(id -g)
          # shellcheck disable=SC2034 # read by the extracted apply_stateful_infra
          redis_acl_changed=1
          # shellcheck disable=SC2034 # read by the extracted apply_stateful_infra
          vps1_stateful=(redis)
          # shellcheck disable=SC2034 # read by the extracted apply_stateful_infra
          vps1_compose=(compose_stub)
          log() { printf '[deploy] %s\n' "$*"; }
          die() { printf '[deploy] error: %s\n' "$*" >&2; exit 1; }
          install -d "$acl_dir"
          printf 'previous-acl\n' > "$acl_previous"
          up_fails=1

          # `$1` is the compose verb; failing `up` is what the guards are about. (A `case` on `$*`
          # with a leading space never matches, which silently tested the healthy path.)
          compose_stub() {
            [[ $up_fails == 1 && ${1:-} == up ]] && return 1
            return 0
          }
          printf 'refused-acl\n' > "$acl_target"
          out=$RUNNER_TEMP/infra-up.log
          set +e
          ( set -e; apply_stateful_infra ) > "$out" 2>&1
          status=$?
          set -e
          cat "$out"
          [[ $status -ne 0 ]] || { echo "::error::a failed up exited 0"; exit 1; }
          [[ "$(cat "$acl_target")" == previous-acl ]] \
            || { echo "::error::the refused ACL was not replaced by the previous one"; exit 1; }
          grep -q 'previous one is back' "$out" \
            || { echo "::error::the restore did not report its result"; exit 1; }

          # The same call with a working compose leaves the new file in place.
          printf 'accepted-acl\n' > "$acl_target"
          up_fails=0
          apply_stateful_infra
          [[ "$(cat "$acl_target")" == accepted-acl ]] \
            || { echo "::error::a healthy up restored an ACL it did not need to"; exit 1; }

      # B2-R1-4: deploy.sh runs as `deploy` over SSH, so it may not do root-only work. The folders,
      # the unit files, `daemon-reload` and `enable` belong to bootstrap-vps.sh, which CI proves
      # installs them; a deploy only verifies them.
      - name: the deploy does no root-only work
        run: |
          set -euo pipefail
          # Comments may name the commands; a line that would run one may not.
          if grep -vE '^[[:space:]]*#' infra/scripts/deploy.sh \
            | grep -nE 'install -d .*-[og] |systemctl (enable|disable|start|stop|daemon-reload)|chown '; then
            echo "::error::deploy.sh does root-only work; bootstrap-vps.sh owns it (B2-R1-4)"
            exit 1
          fi
          grep -q 'require_host_setup' infra/scripts/deploy.sh \
            || { echo "::error::deploy.sh does not verify the host setup"; exit 1; }
          grep -q 'systemctl enable' infra/scripts/bootstrap-vps.sh \
            || { echo "::error::bootstrap-vps.sh does not enable the timers"; exit 1; }
          grep -q 'systemctl daemon-reload' infra/scripts/bootstrap-vps.sh \
            || { echo "::error::bootstrap-vps.sh does not reload systemd"; exit 1; }

      # B2-R1-4: the verifier itself, against a tree shaped like a bootstrapped host: the right modes
      # and owners pass, a missing folder and a wrong mode fail. MADAR_STATE_DIR and MADAR_SRV_ROOT
      # are the CI-only seams; a host never sets them.
      - name: the deploy's folder check rejects a host bootstrap did not prepare
        run: |
          set -euo pipefail
          awk '/^check_dir\(\)/,/^}/' infra/scripts/deploy.sh > "$RUNNER_TEMP/check_dir.sh"
          awk '/^check_dirs\(\)/,/^}/' infra/scripts/deploy.sh > "$RUNNER_TEMP/check_dirs.sh"
          source "$RUNNER_TEMP/check_dir.sh"
          source "$RUNNER_TEMP/check_dirs.sh"
          log() { :; }
          # shellcheck disable=SC2034 # read by the extracted check_dirs
          app_uid=$(id -u)
          # shellcheck disable=SC2034 # read by the extracted check_dirs; root on a host (Kuma's chown)
          kuma_uid=$(id -u)
          grep -qx 'kuma_uid=0' infra/scripts/deploy.sh \
            || { echo "::error::deploy.sh must expect /srv/kuma owned by root: Kuma chowns it on every start"; exit 1; }
          state_dir=$RUNNER_TEMP/state
          srv_root=$RUNNER_TEMP/srv
          install -d -m 750 "$state_dir"
          install -d -m 700 "$srv_root/backup" "$srv_root/secrets"
          install -d -m 755 "$srv_root/kuma"
          check_dirs vps2 || { echo "::error::the folder check rejected the tree bootstrap creates"; exit 1; }
          rmdir "$srv_root/backup"
          if check_dirs vps2; then
            echo "::error::the folder check passed with /srv/backup missing"
            exit 1
          fi
          install -d -m 755 "$srv_root/backup"
          if check_dirs vps2; then
            echo "::error::the folder check passed with /srv/backup at mode 755"
            exit 1
          fi

      # B2-R1-2 (D4): Caddy's admin root is /srv/admin/current, which only bootstrap creates. A VPS-1
      # deploy must stop and name the bootstrap when it is missing or points at nothing.
      - name: the deploy's folder check rejects VPS-1 without the admin release symlink
        run: |
          set -euo pipefail
          for fn in check_dir check_admin_current check_dirs; do
            awk "/^$fn\\(\\)/,/^}/" infra/scripts/deploy.sh > "$RUNNER_TEMP/$fn.sh"
            # shellcheck disable=SC1090 # extracted at run time
            source "$RUNNER_TEMP/$fn.sh"
          done
          log() { :; }
          state_dir=$RUNNER_TEMP/state-admin
          srv_root=$RUNNER_TEMP/srv-admin
          install -d -m 750 "$state_dir"
          install -d "$srv_root/admin/releases/placeholder"
          if check_dirs vps1; then
            echo "::error::the folder check passed with /srv/admin/current missing"
            exit 1
          fi
          ln -s releases/placeholder "$srv_root/admin/current"
          if check_dirs vps1; then
            echo "::error::the folder check passed with /srv/admin/current pointing at an empty release"
            exit 1
          fi
          echo '<!doctype html>' > "$srv_root/admin/releases/placeholder/index.html"
          check_dirs vps1 || { echo "::error::the folder check rejected the admin tree bootstrap creates"; exit 1; }
          grep -A1 'readlink /srv/admin/current' .github/workflows/admin.yml | grep -q '::error::.*bootstrap-vps.sh vps1' \
            || { echo "::error::admin.yml's readlink does not name the bootstrap when the symlink is missing"; exit 1; }

      # D4 (2026-11-03): a changed subnet in vps1.yml made `compose up` stop PostgreSQL and Redis and
      # fail to recreate the network under the running APIs. check_network reads the subnet from the
      # real vps1.yml render and stops the deploy before anything moves; only `docker network` is faked.
      - name: the deploy stops before a subnet change it cannot apply
        run: |
          set -euo pipefail
          awk '/^check_network\(\)/,/^}/' infra/scripts/deploy.sh > "$RUNNER_TEMP/check_network.sh"
          # shellcheck disable=SC1091 # extracted at run time
          source "$RUNNER_TEMP/check_network.sh"
          die() { echo "$*"; exit 1; }
          # shellcheck disable=SC2034 # read by the extracted check_network
          vps1_compose=(docker compose -f infra/compose/vps1.yml --env-file infra/compose/example.env)
          docker() {
            if [[ $1 == network ]]; then
              [[ -n $existing ]] || return 1
              echo "$existing"
              return 0
            fi
            command docker "$@"
          }
          existing=172.30.0.0/24
          (check_network) || { echo "::error::check_network refused the subnet vps1.yml asks for"; exit 1; }
          existing=
          (check_network) || { echo "::error::check_network refused a host with no network yet"; exit 1; }
          existing=172.18.0.0/16
          if out=$(check_network); then
            echo "::error::check_network let a 172.18.0.0/16 network through to compose up"
            exit 1
          fi
          grep -q 'Nothing was stopped' <<<"$out" \
            || { echo "::error::check_network's refusal does not say that nothing was stopped: $out"; exit 1; }
          awk '/^apply_stateful_infra\(\)/,/^}/' infra/scripts/deploy.sh | grep -q '^  check_network$' \
            || { echo "::error::apply_stateful_infra no longer calls check_network before compose up"; exit 1; }

      # B2-R1-3 (D4): every job that joins the CI WireGuard peer through vps1-sync shares one
      # concurrency group, so two runners never bring up the same peer. backend.yml's deploy-vps2
      # is the one exception: it `needs` deploy, so it starts after that job leaves the group.
      - name: every vps1-sync job is in deploy-vps1
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, sys, yaml
          bad = []
          for path in sorted(pathlib.Path('.github/workflows').glob('*.yml')):
              jobs = (yaml.safe_load(path.read_text()) or {}).get('jobs', {})
              for name, job in jobs.items():
                  uses = [s.get('uses', '') for s in job.get('steps', [])]
                  if './.github/actions/vps1-sync' not in uses:
                      continue
                  if (path.name, name) == ('backend.yml', 'deploy-vps2'):
                      needs = job.get('needs', [])
                      if 'deploy' not in (needs if isinstance(needs, list) else [needs]):
                          bad.append(f'{path}:{name} must need deploy')
                      continue
                  group = (job.get('concurrency') or {}).get('group')
                  if group != 'deploy-vps1':
                      bad.append(f'{path}:{name} uses vps1-sync in group {group!r}, not deploy-vps1')
          for line in bad:
              print(f'::error::{line}')
          sys.exit(1 if bad else 0)
          PY

      - name: shellcheck
        run: docker run --rm -v "$PWD:/mnt:ro" -w /mnt koalaman/shellcheck:v0.11.0 --external-sources infra/scripts/*.sh infra/backup/*.sh
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.12 -color

  # Builds and pushes the backup image (madar-backup) on master (R19). It is a separate package from
  # madar-backend because it carries restic, rclone and the postgres client and nothing else; the two
  # host timers pull it by tag. A one-shot run must never build on the host itself.
  build-backup:
    needs: [check]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ${{ vars.ARM_RUNNER || 'ubuntu-24.04' }}
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: image
        name: Image name (GHCR needs a lowercase owner)
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/madar-backup:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - if: vars.ARM_RUNNER == ''
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: infra/backup
          file: infra/backup/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.image.outputs.ref }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=madar-backup
          cache-to: type=gha,mode=max,scope=madar-backup

  # Moves madar-backup:stable to the tag just built, so the host timers can pull one moving tag, and
  # keeps the newest 3 versions inside GHCR's free storage (R13, R19).
  backup-stable:
    needs: [build-backup]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Move madar-backup:stable to ${{ github.sha }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/madar-backup"
          docker buildx imagetools create -t "$image:stable" "$image:${GITHUB_SHA}"
      - uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: madar-backup
          package-type: container
          min-versions-to-keep: 3

  # Applies infra/ to VPS-1 (Compose services and Caddy) without a backend change. Shares the
  # deploy-vps1 group with backend.yml's deploy, so the two never overlap.
  sync:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    concurrency:
      group: deploy-vps1
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: sync
        uses: ./.github/actions/vps1-sync
        with:
          wg-config: ${{ secrets.WG_CI_CONFIG }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      - name: Apply infra on VPS-1
        env:
          SSH_COMMAND: ${{ steps.sync.outputs.ssh-command }}
        run: |
          read -ra ssh <<<"$SSH_COMMAND"
          "${ssh[@]}" vps1 /srv/madar/infra/scripts/deploy.sh --infra-only < /dev/null
      - name: Leave WireGuard
        if: always()
        run: |
          sudo wg-quick down wg0 || true
          rm -rf "$RUNNER_TEMP/madar-ssh"
