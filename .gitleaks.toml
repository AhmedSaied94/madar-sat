# gitleaks config: the default rules, plus allowlist entries for confirmed false positives only
# (gitleaks.yml).
#
# Each entry names the exact false-positive value and the exact files it appears in, with
# condition = "AND" so that both must match. Without it, gitleaks allows a finding when either
# matches, and the paths alone would exempt whole files. Never allowlist a folder or a rule.

title = "Madar Sat"

[extend]
useDefault = true

[[allowlists]]
description = """The documented example access token in Lane B1's admin login schema, its \
OpenAPI export, and the MSW handlers Orval generates from that export for the admin tests. It \
decodes to the header {"alg":"HS256"}, the payload {"sub":"3"} and the literal word \
"signature", so it isn't a signed token."""
condition = "AND"
regexTarget = "match"
paths = [
  '''^backend/app/api/admin/auth\.py$''',
  '''^backend/app/schemas/admin\.py$''',
  '''^backend/openapi/admin\.json$''',
  '''^admin/src/api/generated/admin\.msw\.ts$''',
]
regexes = ['''eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiIzIn0\.signature''']

[[allowlists]]
description = """The documented example device token in D3's device-registration contract, the \
public schema and route that publish it, and the OpenAPI export. It is the base64url of the literal \
"ChangeMe-43-chars-base64url-token", shown to the client generators as a 43-character token; the \
real token is generated per registration, stored only as sha256, and returned once."""
condition = "AND"
regexTarget = "match"
paths = [
  '''^backend/app/api/public/devices\.py$''',
  '''^backend/app/schemas/public\.py$''',
  '''^backend/openapi/public\.json$''',
  '''^specs/003-d03-follow-push-sources/contracts/public-devices\.md$''',
]
regexes = ['''Q2hhbmdlTWUtNDMtY2hhcnMtYmFzZTY0dXJsLXRva2Vu''']
