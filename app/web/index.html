<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="مدار سات — القناة والقمر والتردد لكل مباراة.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="مدار سات">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>مدار سات</title>
  <link rel="manifest" href="manifest.json">

  <!-- Splash until Flutter draws its first frame (product doc S0): the brand mark, as in
       madar-design/design-system/components/Logo/mark.svg, with the satellite orbiting, on the
       `bg` (dark) token. The app's own splash (brand_splash.dart) takes over in the same place. -->
  <style>
    @font-face { font-family: Changa; font-weight: 800; font-display: swap; src: url(assets/assets/fonts/Changa-ExtraBold.ttf); }
    @font-face { font-family: "IBM Plex Sans Arabic"; font-weight: 400; font-display: swap; src: url(assets/assets/fonts/IBMPlexSansArabic-Regular.ttf); }
    html, body { margin: 0; height: 100%; background: #07090C; }
    #splash { position: fixed; inset: 0; background: #07090C; transition: opacity 200ms ease-out; }
    #splash.done { opacity: 0; pointer-events: none; }
    #splash svg { position: absolute; left: 50%; top: 50%; width: 150px; height: 150px; margin: -75px 0 0 -75px; overflow: visible; }
    #splash p { position: absolute; left: 24px; right: 24px; top: calc(50% + 120px); margin: 0; text-align: center; color: #A9B2BF; font: 400 14px/1.5 "IBM Plex Sans Arabic", sans-serif; }
    #splash b { display: block; margin-bottom: 12px; color: #F1F4F7; font: 800 34px/1 Changa, sans-serif; }
    .splash-sat {
      offset-path: path("M26.524 10.402A11.84 2.86 -28 1 0 5.616 21.518A11.84 2.86 -28 1 0 26.524 10.402");
      offset-rotate: 0deg; animation: splash-orbit 1.8s linear infinite;
    }
    @keyframes splash-orbit { to { offset-distance: 100%; } }
    @media (prefers-reduced-motion: reduce) { .splash-sat { animation: none; } }
  </style>
</head>
<body>
  <div id="splash" aria-hidden="true" dir="rtl">
    <svg viewBox="0 0 32 32" fill="none">
      <defs>
        <mask id="near-band" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32"><rect width="32" height="32" fill="#fff"/><path d="M5.616 21.518A11.84 2.86 -28 0 0 26.524 10.402" stroke="#000" stroke-width="3.08"/></mask>
        <clipPath id="near-half"><rect x="-24" y="0" width="48" height="24" transform="translate(16.07 15.96) rotate(-28)"/></clipPath>
        <g id="sat" fill="#F1F4F7" transform="rotate(-28)"><rect x="-1.07" y="-1.07" width="2.14" height="2.14" rx=".5"/><rect x="-3.56" y="-.59" width="1.9" height="1.18" rx=".2"/><rect x="1.66" y="-.59" width="1.9" height="1.18" rx=".2"/></g>
      </defs>
      <g stroke="#161B22" stroke-width=".13"><circle cx="16" cy="16" r="16.85"/><circle cx="16" cy="16" r="19.6"/><circle cx="16" cy="16" r="36.3"/><circle cx="16" cy="16" r="55.5"/></g>
      <ellipse cx="16.07" cy="15.96" rx="11.84" ry="2.86" stroke="#C8F542" stroke-width="1.66" transform="rotate(-28 16.07 15.96)"/>
      <g class="splash-sat"><use href="#sat"/></g>
      <circle cx="16" cy="16" r="5.69" fill="#F1F4F7" mask="url(#near-band)"/>
      <g clip-path="url(#near-half)"><g class="splash-sat"><use href="#sat"/></g></g>
    </svg>
    <p><b>مدار سات</b>أي قناة تنقل المباراة؟<br>والتردد جاهز.</p>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      splash.classList.add('done');
      setTimeout(function () { splash.remove(); }, 200);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
