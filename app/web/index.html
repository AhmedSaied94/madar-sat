<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="مدار سات — القناة والقمر والتردد لكل مباراة.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="مدار سات">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>مدار سات</title>
  <link rel="manifest" href="manifest.json">

  <!-- Splash until Flutter draws its first frame: the brand mark on the brand ground (PB S0),
       the `on-accent` token, as on Android. -->
  <style>
    html, body { margin: 0; height: 100%; background: #0A0D0F; }
    #splash {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #0A0D0F; transition: opacity 200ms ease-out;
    }
    #splash img { width: 96px; height: 96px; }
    #splash.done { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="splash" aria-hidden="true"><img src="icons/Icon-192.png" alt="" width="96" height="96"></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      splash.classList.add('done');
      setTimeout(function () { splash.remove(); }, 200);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
