# VPS-1 "app": Caddy, api-public, api-admin, PostgreSQL 16, Redis 7 (FR-020, SD §7.1, research R12).
# Run on the host from the synced /srv/madar/infra by scripts/deploy.sh:
#   docker compose --env-file /srv/madar/.env -f compose/vps1.yml ...
# Every image is linux/arm64. Secrets come only from /srv/madar/.env (mode 600), through env_file.
# Published ports are bound to one address each, because Docker-published ports skip the host's
# INPUT chain: 127.0.0.1 (api-public), 10.8.0.1 on wg0 (api-admin) and the VCN IP (data stores).
name: madar

x-service: &service
  platform: linux/arm64
  restart: unless-stopped
  # CI and dev point this at example.env through MADAR_ENV_FILE; hosts use the default.
  env_file: ${MADAR_ENV_FILE:-/srv/madar/.env}
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "5"

x-backend: &backend
  <<: *service
  # `${IMAGE_TAG:-none}`: Compose interpolates the whole file for every command, including the
  # backup timers' `run`, whose shell has no IMAGE_TAG (B2-R1-1). `none` cannot be pulled, and
  # deploy.sh always passes a real tag, so a hand-run `up` fails loudly instead of starting an old
  # image.
  image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER}/madar-backend:${IMAGE_TAG:-none}
  environment:
    # Only the rollback drill sets this (deploy.sh, backend.yml break_healthcheck).
    HEALTHZ_FORCE_FAIL: ${HEALTHZ_FORCE_FAIL:-false}
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # Host network, so it can serve the public sites and bind the wg0 address. It mounts the whole
  # infra directory, never the single Caddyfile: rsync replaces files by rename, and a single-file
  # bind mount would keep serving the old one.
  caddy:
    <<: *service
    image: caddy:2.11.7
    network_mode: host
    command: ["caddy", "run", "--config", "/etc/madar/infra/Caddyfile", "--adapter", "caddyfile"]
    volumes:
      - /srv/madar/infra:/etc/madar/infra:ro
      - /srv/media:/srv/media:ro
      - /srv/app-mirror:/srv/app-mirror:ro
      - /srv/admin:/srv/admin:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  api-public:
    <<: *backend
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Bound to the wg0 address only (constitution V); Caddy's wg0 site proxies /admin/api to it.
  # Proxy headers are trusted from the Caddy on wg0 (10.8.0.1) and from nowhere else, so
  # X-Forwarded-For reaches the login limiter only through Caddy (FR-003, R3). Uploads and the
  # first admin's logos are written to /srv/media, so the service mounts it read-write.
  api-admin:
    <<: *backend
    command:
      - gunicorn
      - app.admin:app
      - -k
      - uvicorn.workers.UvicornWorker
      - -w
      - "1"
      - -b
      - 0.0.0.0:8001
      - --forwarded-allow-ips=10.8.0.1
    environment:
      HEALTHZ_FORCE_FAIL: ${HEALTHZ_FORCE_FAIL:-false}
      FORWARDED_ALLOW_IPS: 10.8.0.1
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?set ADMIN_JWT_SECRET}
    ports:
      - "10.8.0.1:8001:8001"
    volumes:
      - /srv/media:/srv/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/admin/api/healthz', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Importer-found logos (FR-024, R20). It sits next to the media disk, so no file has to cross
  # the VCN: VPS-2's import workers only queue `adapters.rehost_logo` on the `media` queue. One
  # process and a 256 MB cap are enough for a few logos a day. Deployed with the APIs and rolled
  # back with them (scripts/deploy.sh).
  worker-media:
    <<: *backend
    command: ["celery", "-A", "app.workers", "worker", "-Q", "media", "-n", "worker@%h", "-c", "1", "--loglevel=INFO", "--without-gossip", "--without-mingle"]
    environment:
      HEALTHZ_FORCE_FAIL: ${HEALTHZ_FORCE_FAIL:-false}
    mem_limit: 256m
    volumes:
      - /srv/media:/srv/media
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers inspect ping --destination \"worker@$$HOSTNAME\" --timeout 10 >/dev/null"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 30s

  # One-off: `docker compose run --rm migrate` (deploy.sh step 4).
  migrate:
    <<: *backend
    profiles: [tools]
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    healthcheck:
      disable: true

  # One-off backend CLI, for the snapshot load and media rehost (Lane B1), for example:
  #   docker compose run --rm cli load-snapshot --snapshot-dir /srv/snapshot --report-dir /srv/reports
  cli:
    <<: *backend
    profiles: [tools]
    restart: "no"
    entrypoint: ["python", "-m", "app.cli"]
    command: ["--help"]
    volumes:
      - /srv/media:/srv/media
      - /srv/snapshot:/srv/snapshot:ro
      - /srv/reports:/srv/reports
    healthcheck:
      disable: true

  # One-shot media backup (R19), started by backup-media.timer at 03:30 and
  # backup-media-weekly.timer on Sundays at 04:00, both Africa/Cairo:
  #   docker compose -f compose/vps1.yml run --rm -T backup-media [--weekly]
  # It mirrors /srv/media to the OCI bucket with rclone, and on Sundays also takes a restic snapshot
  # into the same repository as the database. Media lives on this disk, which is why it runs here and
  # not on VPS-2: the files never cross the VCN in either direction.
  #
  # Its own image variable, not the backend's IMAGE_TAG (B2-R1-1), and the image's user (uid 10001)
  # because the media files are mode 0600 owned by that uid (B2-R1-2). /srv/media is mounted
  # read-only; the caches live in /tmp.
  backup-media:
    platform: linux/arm64
    profiles: [backup]
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER}/madar-backup:${BACKUP_IMAGE_TAG:-stable}
    env_file: ${MADAR_ENV_FILE:-/srv/madar/.env}
    user: "10001:10001"
    environment:
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/cache
      RESTIC_CACHE_DIR: /tmp/restic-cache
    restart: "no"
    entrypoint: ["/opt/backup/backup-media.sh"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ../backup:/opt/backup:ro
      - /srv/media:/srv/media:ro
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

  backup-media-weekly:
    extends: backup-media
    entrypoint: ["/opt/backup/backup-media.sh", "--weekly"]

  postgres:
    <<: *service
    image: postgres:16.15
    command: ["postgres", "-c", "shared_buffers=1536MB"]
    shm_size: 256mb
    ports:
      - "${VCN_IP:?set VCN_IP}:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Passwords come from the rendered ACL file, not from the command line: /srv/madar/redis/users.acl
  # is written by scripts/deploy.sh from infra/redis/users.acl.tmpl and /srv/madar/.env, mode 640 and
  # group 999 (the redis user), so it never appears here and the `homebox` user (the owner's scrape
  # box) exists (R21). The directory is mounted, not the file: `install` replaces the inode, and a
  # single-file bind would keep serving the old ACL (B2-R1-1, B2-R1-7).
  # volatile-lru evicts only keys with a TTL (cache), never the Celery queues.
  redis:
    <<: *service
    image: redis:7.4.12
    command:
      - sh
      - -c
      - >-
        exec docker-entrypoint.sh redis-server --aclfile /etc/redis/users.acl
        --maxmemory 512mb --maxmemory-policy volatile-lru --appendonly yes
    ports:
      - "${VCN_IP:?set VCN_IP}:6379:6379"
      # The home box reaches Redis over WireGuard; only its peer address may connect (T082).
      - "10.8.0.1:6379:6379"
    volumes:
      - redisdata:/data
      - /srv/madar/redis:/etc/redis:ro
    healthcheck:
      # Still the `default` user, so the healthcheck proves the admin path works.
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
