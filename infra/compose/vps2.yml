# VPS-2 "workers": the Celery processes of SD §6.1, exactly one beat, and Flower (FR-020).
# Everything is under the `workers` profile, so a Compose command must name `--profile workers`:
#   IMAGE_TAG=<sha> docker compose --env-file /srv/madar/.env -f compose/vps2.yml --profile workers \
#     up -d worker-imports worker-scrape worker-maintenance beat      # scripts/deploy.sh --host vps2
# `worker-live`, `worker-notify` and `flower` stay defined but are not started on D2.
# Every image is linux/arm64. Secrets come only from /srv/madar/.env (mode 600). The workers reach
# PostgreSQL and Redis on VPS-1's VCN IP (DATABASE_URL, REDIS_URL, CELERY_BROKER_URL).
name: madar

x-service: &service
  platform: linux/arm64
  restart: unless-stopped
  profiles: [workers]
  # CI points this at example.env through MADAR_ENV_FILE; hosts use the default.
  env_file: ${MADAR_ENV_FILE:-/srv/madar/.env}
  security_opt:
    - no-new-privileges:true
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "5"

x-worker: &worker
  <<: *service
  image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER}/madar-backend:${IMAGE_TAG:?set IMAGE_TAG}
  cap_drop:
    - ALL
  healthcheck:
    test: ["CMD-SHELL", "celery -A app.workers inspect ping --destination \"worker@$$HOSTNAME\" --timeout 10 >/dev/null"]
    interval: 60s
    timeout: 20s
    retries: 3
    start_period: 30s

services:
  # Normalize, upsert, entity resolution, media rehosting, and the raw pages it saves for 5 days
  # (RAW_ROOT=/srv/raw, data-model §Raw pages).
  worker-imports:
    <<: *worker
    command: ["celery", "-A", "app.workers", "worker", "-Q", "imports", "-n", "worker@%h", "-c", "1", "--loglevel=INFO", "--without-gossip", "--without-mingle"]
    environment:
      RAW_ROOT: ${RAW_ROOT:-/srv/raw}
    volumes:
      - /srv/raw:/srv/raw

  # Fetch and parse only, under the `scrape` queue. The default path is the owner's home box
  # (`scrape_home`); switch with YSSCORES_FETCH_QUEUE=scrape if ysscores stops blocking VPS IPs.
  worker-scrape:
    <<: *worker
    command: ["celery", "-A", "app.workers", "worker", "-Q", "scrape", "-n", "worker@%h", "-c", "1", "--loglevel=INFO", "--without-gossip", "--without-mingle"]

  worker-live:
    <<: *worker
    command: ["celery", "-A", "app.workers", "worker", "-Q", "live", "-n", "worker@%h", "-c", "1", "--loglevel=INFO", "--without-gossip", "--without-mingle"]

  # The dispatcher and scheduler of D3 (SD §6.8). It is the only service that needs the FCM service
  # account, so it is the only one that mounts /srv/secrets: the file is mode 600 and read-only here,
  # and the runbook says who may read it (R9). Started with the other workers from D3 on.
  worker-notify:
    <<: *worker
    command: ["celery", "-A", "app.workers", "worker", "-Q", "notifications", "-n", "worker@%h", "-c", "2", "--loglevel=INFO", "--without-gossip", "--without-mingle"]
    volumes:
      - /srv/secrets:/srv/secrets:ro

  # Cleanup, media copy, dataset versions. `adapters.prune_raw_pages` needs the raw disk.
  worker-maintenance:
    <<: *worker
    command: ["celery", "-A", "app.workers", "worker", "-Q", "maintenance", "-n", "worker@%h", "-c", "1", "--loglevel=INFO", "--without-gossip", "--without-mingle"]
    environment:
      RAW_ROOT: ${RAW_ROOT:-/srv/raw}
    volumes:
      - /srv/raw:/srv/raw

  # Exactly one beat, ever (SD §6.1). The fixed container_name makes `--scale beat=2` fail.
  beat:
    <<: *worker
    container_name: madar-beat
    command: ["celery", "-A", "app.workers", "beat", "--schedule", "/tmp/celerybeat-schedule", "--pidfile", "/tmp/celerybeat.pid"]
    healthcheck:
      test: ["CMD-SHELL", "kill -0 \"$$(cat /tmp/celerybeat.pid)\""]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Uptime Kuma (R20): the monitors the owner creates from docs/runbooks/uptime-kuma.md — four HTTP
  # checks and six push monitors. Its UI is published on the VCN address only; VPS-1's wg0 Caddy
  # proxies it at https://10.8.0.1/kuma/, so it is never public. Data lives in /srv/kuma.
  uptime-kuma:
    <<: *service
    image: louislam/uptime-kuma:1
    container_name: madar-kuma
    ports:
      - "${VCN_IP:?set VCN_IP}:3001:3001"
    volumes:
      - /srv/kuma:/app/data
    healthcheck:
      test: ["CMD-SHELL", "extra/healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  # One-shot database backup (R19), started by backup-db.timer through `compose run --rm backup-db`.
  # It reads the database over the VCN from VPS-1, stages the dump on /srv/backup and pushes it to
  # Backblaze B2 with restic; the heartbeat goes to Kuma. The script is mounted, not baked, so a
  # change to it is a deploy. `profiles: [backup]` keeps it out of every `up`.
  backup-db:
    platform: linux/arm64
    profiles: [backup]
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER}/madar-backup:${IMAGE_TAG:?set IMAGE_TAG}
    env_file: ${MADAR_ENV_FILE:-/srv/madar/.env}
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ../backup:/opt/backup:ro
      - /srv/backup:/srv/backup
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

  # Queue dashboard, on localhost only until Caddy proxies it over wg0 (SD §7.2). Basic auth
  # from FLOWER_BASIC_AUTH; the broker from CELERY_BROKER_URL.
  flower:
    <<: *service
    image: mher/flower:2.2.0
    command: ["celery", "flower", "--port=5555"]
    ports:
      - "127.0.0.1:5555:5555"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5555/healthcheck', timeout=4)"]
      interval: 60s
      timeout: 5s
      retries: 3
