<!doctype html>
<!-- Madar Design System · Cover. Static specimen: classes come from components.css, values from tokens.css. Set data-theme="light" on <html> for the light theme. -->
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../tokens.css">
<style>
body{margin:0;background:var(--bg)}
.cov{position:relative;width:960px;height:300px;overflow:hidden;background:var(--bg)}
.cov svg{position:absolute;inset:0;width:960px;height:300px;display:block}
.slab{fill:var(--accent);rx:var(--radius-xl)}
.well{fill:var(--readout);rx:var(--radius-xl)}
.steel{fill:var(--text-tertiary);rx:var(--radius-xl)}
.live{fill:var(--live)}
.orbit{fill:none;stroke:var(--bg);stroke-width:var(--space-2)}
.sat{fill:var(--bg)}
.txt{position:absolute;left:48px;bottom:36px;width:440px;direction:ltr}
.nm{font:800 120px/.92 var(--font-display);color:var(--text-primary);letter-spacing:-.01em;margin:0}
.tg{font:500 14px/1.4 var(--font-sans);color:var(--text-secondary);margin:8px 0 0}
</style>
</head>
<body>
<div class="cov">
<!--
  blocks: accent slab 360×216 (bleeds top/right) · readout 168×108 · text-tertiary steel 192×108 · live disc r24 (the live dot: a state, kept small)
  arrangement: one volt slab top-right with three satellites in a row beneath it on a 24px gutter, bleeding off the bottom and right edges
  pattern: orbit motif → arcs; «مدار» means orbit, so four ground-coloured orbit rings (r 48/96/144/192) and one satellite disc are cut from the slab's corner, like the brand mark
  scales: gutters space-6 (24) · ring stroke space-2 (8) · ring pitch space-12 (48) · block corners radius-xl (18) · disc radius-pill
-->
<svg viewBox="0 0 960 300" aria-hidden="true">
  <defs><clipPath id="slabclip"><rect class="slab" x="624" y="-24" width="360" height="216"></rect></clipPath></defs>
  <rect class="slab" x="624" y="-24" width="360" height="216"></rect>
  <g clip-path="url(#slabclip)">
    <circle class="orbit" cx="960" cy="0" r="48"></circle>
    <circle class="orbit" cx="960" cy="0" r="96"></circle>
    <circle class="orbit" cx="960" cy="0" r="144"></circle>
    <circle class="orbit" cx="960" cy="0" r="192"></circle>
    <circle class="sat" cx="858" cy="102" r="12"></circle>
  </g>
  <rect class="well" x="528" y="216" width="168" height="108"></rect>
  <circle class="live" cx="744" cy="252" r="24"></circle>
  <rect class="steel" x="792" y="216" width="192" height="108"></rect>
</svg>
<div class="txt"><p class="nm">Madar</p><p class="tg">Where every match airs, and how to tune it.</p></div>
</div>
<script>/* cover: static */</script>
</body>
</html>
