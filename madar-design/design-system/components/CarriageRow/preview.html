<!doctype html>
<!-- Madar Design System · CarriageRow · Channels. Static specimen: classes come from components.css, values from tokens.css. Set data-theme="light" on <html> for the light theme. -->
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../components.css">
</head>
<body>
<div class="dsx">
<div class="card flat" style="background:var(--s1)">
  <div class="cr">
    <span class="lt l40 ch"><span class="ic i-tv s14"></span><span class="ltr">ON</span></span>
    <div class="bd"><div class="l1"><span class="cn"><span class="ltr">ON Sport HD</span></span><span class="spacer"></span><span class="ab free"><span class="ic i-unlock s12"></span>مجانية</span></div><div class="l2"><span class="satb"><span class="ic i-sat s14"></span>نايل سات</span><span class="fq"><span>11977</span><span class="p">V</span><span class="sr">27500</span></span></div></div>
    <span class="ic i-chd s18 chev"></span>
  </div>
  <div class="cr open bt">
    <span class="lt l40 ch"><span class="ic i-tv s14"></span><span class="ltr">bS1</span></span>
    <div class="bd">
      <div class="l1"><span class="cn"><span class="ltr">beIN SPORTS 1</span></span><span class="spacer"></span><span class="ab enc"><span class="ic i-lock s12"></span>مشفرة · <span class="ltr">beIN</span></span></div>
      <div class="l2"><span class="satb"><span class="ic i-sat s14"></span>نايل سات</span><span class="fq"><span>11013</span><span class="p">H</span><span class="sr">27500</span></span></div>
      <div class="xd">
        <span class="k">القمر</span><span class="v">نايل سات · <span class="ltr">Nilesat 7.0W</span></span>
        <span class="k">التردد</span><span class="v"><span class="ltr mono">11013 MHz</span></span>
        <span class="k">الاستقطاب</span><span class="v"><span class="ltr mono">H</span> · أفقي</span>
        <span class="k">معدل الترميز</span><span class="v"><span class="ltr mono">27500</span></span>
        <span class="k">الوصول</span><span class="v">مشفرة · <span class="ltr">beIN</span></span>
        <span class="k">الفئة</span><span class="v"><span class="pill p-sp">رياضة</span></span>
      </div>
      <div class="cm" style="background:var(--bg)"><span class="av">أب</span><div class="col f1"><span class="lbl"><span class="ic i-mic s12"></span>المعلق</span><span class="nm">أحمد البلوشي</span></div><button class="play" aria-label="تشغيل"><span class="ic i-play s18"></span></button></div>
      <div class="acts">
        <button class="btn btn-s btn-xs"><span class="ic i-copy s14"></span>نسخ التردد</button>
        <button class="btn btn-s btn-xs"><span class="ic i-bell s14"></span>تابع القناة</button>
        <button class="btn btn-s btn-xs"><span class="ic i-yt s14"></span>طريقة استقبال القمر</button>
        <button class="btn btn-o btn-xs"><span class="ic i-tv s14"></span>عرض القناة</button>
      </div>
    </div>
    <span class="ic i-chu s18 chev"></span>
  </div>
</div>
</div>
<script>/* static specimen: markup and classes from components/bundle.css */</script>
</body>
</html>
