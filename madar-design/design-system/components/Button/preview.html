<!doctype html>
<!-- Madar Design System · Button · Controls. Static specimen: classes come from components.css, values from tokens.css. Set data-theme="light" on <html> for the light theme. -->
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../components.css">
</head>
<body>
<div class="dsx">
<div class="bm">
  <span></span><span class="k">default</span><span class="k">hover</span><span class="k">pressed</span><span class="k">focus</span><span class="k">disabled</span>
  <span class="k">primary</span><button class="btn btn-p">تفعيل</button><button class="btn btn-p" style="filter:brightness(1.06)">تفعيل</button><button class="btn btn-p press">تفعيل</button><button class="btn btn-p focus">تفعيل</button><button class="btn dis">تفعيل</button>
  <span class="k">secondary</span><button class="btn btn-s">نسخ</button><button class="btn btn-s" style="background:var(--s3)">نسخ</button><button class="btn btn-s" style="background:var(--s3);filter:brightness(.92)">نسخ</button><button class="btn btn-s focus">نسخ</button><button class="btn dis">نسخ</button>
  <span class="k">outline</span><button class="btn btn-o">تابع</button><button class="btn btn-o" style="background:var(--s2)">تابع</button><button class="btn btn-o" style="background:var(--s3)">تابع</button><button class="btn btn-o focus">تابع</button><button class="btn btn-o" style="opacity:.4">تابع</button>
  <span class="k">ghost</span><button class="btn btn-g">تخطي</button><button class="btn btn-g" style="background:var(--s2)">تخطي</button><button class="btn btn-g" style="background:var(--s3)">تخطي</button><button class="btn btn-g focus">تخطي</button><button class="btn btn-g" style="opacity:.4">تخطي</button>
  <span class="k">danger</span><button class="btn btn-d">حذف</button><button class="btn btn-d" style="filter:brightness(1.1)">حذف</button><button class="btn btn-d" style="filter:brightness(.9)">حذف</button><button class="btn btn-d focus">حذف</button><button class="btn btn-d" style="opacity:.4">حذف</button>
</div>
<div class="row g8 wrap" style="align-items:center">
  <button class="btn btn-p" aria-busy="true"><span class="spin"></span>جارٍ الحفظ</button><button class="btn btn-s btn-sm"><span class="ic i-copy s16"></span>صغير</button><button class="btn btn-s btn-xs">أصغر</button>
  <span class="spacer"></span>
  <button class="fb"><span class="ic i-star s16"></span>تابع</button><button class="fb on"><span class="ic i-starf s16"></span>تتابعه</button>
  <span class="ib fill"><span class="ic i-bell s20"></span></span><span class="ib fill on"><span class="ic i-bellf s20"></span></span><span class="ib fill t3"><span class="ic i-belloff s20"></span></span>
</div>
</div>
<script>/* static specimen: markup and classes from components/bundle.css */</script>
</body>
</html>
