<!doctype html>
<!-- Madar Design System · Chip · Controls. Static specimen: classes come from components.css, values from tokens.css. Set data-theme="light" on <html> for the light theme. -->
<html lang="ar" dir="rtl" data-theme="dark">
<head>

<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="../../tokens.css">

<div class="dsx">

</div>
