[project]
name = "madar-backend"
version = "1.0.0"
description = "Madar Sat backend: public /v1 read API and admin API (D1 foundation)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "gunicorn>=22.0.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.1.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "email-validator>=2.1.0",
    "pydantic-settings>=2.3.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "pillow>=10.3.0",
    "argon2-cffi>=23.1.0",
    "PyJWT>=2.8.0",
    "python-multipart>=0.0.9",
    "celery[redis]>=5.4.0",
    "lxml>=5.2.0",  # Lane B2's HTML parser, added here because B1 owns this file
    "firebase-admin>=6.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "schemathesis>=3.30.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP"]
# E501 handled by formatter; keep unused-import as error (F401), allow bandit's
# "assert" and "any other subprocess" complaints that are intentional in tests/CLI.
ignore = [
    "S101",  # assert used in tests
    "S404",  # subprocess without shell=False (CLI ffmpeg)
    "S603",  # subprocess without shell=True check
    "S607",  # partial executable path (ffmpeg on PATH)
    "B008",  # FastAPI Depends() in default args is idiomatic
    "UP046",  # TypeVar generics are the FastAPI/Pydantic-idiomatic form
    "UP047",
    "UP017",  # datetime.timezone.utc is clearer than the UTC alias
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "B017"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

# Celery and kombu ship no type information.
[[tool.mypy.overrides]]
module = ["celery", "celery.*", "kombu", "kombu.*", "firebase_admin", "firebase_admin.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
source = ["app/domain", "app/services", "app/adapters", "app/devices", "app/notifications", "app/live"]
# SQLAlchemy's async layer runs on greenlets; without this, lines after an await go untraced.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
fail_under = 70

[tool.coverage.paths]
source = ["app"]
